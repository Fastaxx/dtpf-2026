name: Publish talk

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.6.42
      - run: quarto render index.qmd
      # Figures, videos and fonts are embedded in index.html; MathJax is not.
      - run: |
          mkdir -p _site/theme/mathjax
          cp index.html _site/
          cp theme/mathjax/tex-svg-full.js _site/theme/mathjax/
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v5

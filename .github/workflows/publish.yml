name: Publish talk

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  STEM: S4.02_Libat_SharpInterfaceTwoFluid

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.6.42
      - run: quarto render index.qmd
      # Figures, videos and fonts are embedded in index.html; MathJax is not: it is loaded from
      # theme/mathjax/, so every copy of the deck ships that file next to the HTML.
      - name: Site
        run: |
          mkdir -p _site/theme/mathjax
          cp index.html _site/
          cp theme/mathjax/tex-svg-full.js _site/theme/mathjax/
      - name: Offline package (for a USB stick)
        run: |
          mkdir -p "pkg/$STEM/theme/mathjax"
          cp index.html "pkg/$STEM/$STEM.html"
          cp theme/mathjax/tex-svg-full.js "pkg/$STEM/theme/mathjax/"
          (cd pkg && zip -qr "../_site/$STEM.zip" "$STEM")
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: PDF (every click step shown)
        run: |
          npx -y decktape@3.12.0 reveal --size 1280x720 --pause 1500 --load-pause 2000 \
            --chrome-arg=--no-sandbox \
            --pdf-author "Louis Libat" \
            --pdf-title "Numerical modelling of heat and mass transfer with phase change using a sharp-interface two-fluid method" \
            "index.html?fragments=false" "_site/$STEM.pdf"
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v5
